name: Actualizar noticias financieras cada 5 minutos
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: noticias-financieras
  cancel-in-progress: true
jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recopilar titulares RSS
        run: python news_feed.py
      - name: Publicar cambios
        run: |
          git config user.name "bot-mercado"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Actualizar noticias financieras"
          git push
